name: Build

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build:

    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4

    - name: Add MSBuild to PATH
      uses: microsoft/setup-msbuild@v2

    - name: Build Solution
      run: msbuild.exe AutoSite.sln /p:Configuration=Release /p:TargetFrameworkVersion=v2.0

    - name: Upload build artifact
      uses: actions/upload-artifact@v4
      with:
        name: AutoSite_nightly
        path: |
          AutoSite/bin/Debug/*.exe
          AutoSite/bin/Debug/*.dll
          AutoSite/bin/Debug/*.exe.config
          AutoSite/bin/Debug/*/
          AutoSite/dist/**
